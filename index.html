<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3f3f6">
<title>6×6 リバーシ - 先攻強化版</title>
<!-- 後攻AI: local 6x6-reversi-oracle (worker + WASM), no external fetch -->
<!-- 6x6 AI v3: PVS/置換表/ムーブオーダリング/終盤完全読みを独自実装。yaskodama/othello6x6 (MIT) の設計資料を参考。 -->
<style>
:root{
  --purple:#5147c7; --bg:#f3f3f6; --panel:#fff; --text:#17171b; --muted:#676772;
  --line:#4f4f4f; --cell:#c9c9c9; --cell2:#d4d4d4; --corner:#8d8d8d;
  --hint:#fff28a; --hint2:#fff7b0; --last:#2081ff; --rec:#16a0ff; --danger:#d93025;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,.cell,.seg,.bottom-actions,.board{touch-action:manipulation}
html,body{margin:0;min-height:100%;background:#f3f3f6!important;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17171b;color-scheme:light}
body{padding:max(10px,env(safe-area-inset-top)) 0 max(16px,env(safe-area-inset-bottom))}
.app{max-width:680px;margin:0 auto;padding:0 10px}
.score-card{background:#fff;border-radius:16px;padding:11px 12px;display:grid;grid-template-columns:auto auto 1fr auto auto;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.07)}
.disc-sm{width:31px;height:31px;border-radius:50%;border:1px solid #777;display:block}
.disc-sm.b{background:radial-gradient(circle at 35% 28%,#444,#151515 45%,#050505)}
.disc-sm.w{background:radial-gradient(circle at 35% 28%,#fff,#f4f4f4 58%,#cfcfcf)}
.count{font-size:20px;font-weight:800}.pct{font-size:19px;font-weight:800;white-space:nowrap}
.meter-wrap{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center}
.meter{height:13px;border:1px solid #bbb;background:#e8e8e8;display:flex}.meter-b{background:#202020;width:55%}.meter-w{flex:1}
.top-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.control-card{display:flex;gap:7px;align-items:center;font-weight:750}
.control-card label{white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--purple);border-radius:10px;overflow:hidden;flex:1}
.seg button{border:0;background:#fff;color:var(--purple);padding:10px 5px;font-weight:800}
.seg button.on{background:var(--purple);color:#fff}
.recommend-row{margin-top:8px;background:#fff;border:1px solid #ddd;border-radius:11px;padding:8px 10px;display:flex;align-items:center;gap:10px;font-weight:750}
.recommend-row button{border:1.5px solid var(--purple);background:#fff;color:var(--purple);border-radius:9px;padding:8px 12px;font-weight:800}
.recommend-row button.on{background:#f0eeff}
.info-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}
.info-box{background:#fff;border:1px solid #ddd;border-radius:11px;padding:8px 6px;text-align:center}
.info-box b{display:block;color:var(--purple);font-size:13px;margin-bottom:2px}
.info-box strong{font-size:18px}
.board-shell{margin-top:18px}
.cols{display:grid;grid-template-columns:27px repeat(6,1fr);text-align:center;color:#666;font-weight:700;margin-bottom:3px}
.board-row{display:grid;grid-template-columns:27px 1fr}
.rows{display:grid;grid-template-rows:repeat(6,1fr);place-items:center;color:#666;font-weight:700}
.board{aspect-ratio:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);background:#444;border:5px solid #444}
.cell{position:relative;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(145deg,var(--cell2),var(--cell));padding:0;display:grid;place-items:center;border-radius:0}
.cell:nth-child(6n){border-right:0}.cell:nth-child(n+31){border-bottom:0}
.cell.corner{background:linear-gradient(145deg,#989898,var(--corner))}
.cell.legal{background:radial-gradient(circle,var(--hint2) 0,var(--hint) 62%,#e8db7e 100%);box-shadow:inset 0 0 13px rgba(255,235,70,.55)}
.stone{width:70%;height:70%;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.3),inset 0 2px 3px rgba(255,255,255,.16);z-index:2}
.stone.b{background:radial-gradient(circle at 35% 28%,#454545,#171717 48%,#080808)}
.stone.w{background:radial-gradient(circle at 35% 28%,#fff,#f6f6f6 60%,#d5d5d5);border:1px solid #aaa}
.eval-num{position:absolute;right:4px;bottom:3px;font-size:12px;font-weight:850;color:#565663;z-index:3}
.cell.last:after{content:"";position:absolute;inset:4px;border:3px solid var(--last);z-index:4;pointer-events:none}
.cell.recommended{outline:4px solid var(--rec);outline-offset:-4px}
.cell.recommended:before{content:"★";position:absolute;left:4px;top:2px;color:#127ad3;font-size:17px;font-weight:900;z-index:5}
.bottom-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}
.bottom-actions button{border:1px solid #ddd;background:#fff;color:var(--purple);border-radius:11px;padding:11px 5px;font-weight:800}
.status{margin-top:8px;background:#eeecff;border-radius:11px;padding:9px 12px;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.confirm{display:none;background:#fff;border:1px solid #ddd;border-radius:11px;padding:11px;margin-top:8px}
.confirm.show{display:block}.confirm .buttons{display:flex;gap:7px;margin-top:8px}.confirm button{flex:1;border:0;border-radius:8px;padding:9px;font-weight:800}.danger{background:var(--danger);color:#fff}.cancel{background:#eee}
.result{display:none;background:#fff;border:1px solid #ddd;border-radius:11px;padding:12px;margin-top:8px;text-align:center;font-weight:800}.result.show{display:block}
@media(max-width:480px){
  .app{padding:0 8px}.score-card{padding:10px 9px}.disc-sm{width:28px;height:28px}.count{font-size:18px}.pct{font-size:17px}
  .top-controls{gap:6px}.control-card{font-size:14px}.seg button{padding:9px 4px}.recommend-row{font-size:14px}
  .cols{grid-template-columns:24px repeat(6,1fr)}.board-row{grid-template-columns:24px 1fr}
  .bottom-actions button{font-size:13px}.eval-num{font-size:11px}.status{font-size:13px}
}

.simple-score{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stone-score{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:800;font-size:18px}
.stone-score strong{font-size:22px}
.one-control{grid-template-columns:1fr}
.one-control .control-card{max-width:340px;margin:0 auto;width:100%}


.boot-fallback{display:none;position:fixed;inset:0;z-index:99999;background:#f3f3f6;color:#17171b;padding:24px;font:700 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.boot-fallback.show{display:block}
</style>
</head>
<body>
<div id="bootFallback" class="boot-fallback">画面の読み込みで問題が発生しました。ページを再読み込みしてください。</div>
<div class="app">
  <section class="score-card simple-score">
    <div class="stone-score"><span class="disc-sm b"></span><span>黒</span><strong id="blackCount">2</strong></div>
    <div class="stone-score"><span class="disc-sm w"></span><span>白</span><strong id="whiteCount">2</strong></div>
  </section>

  <section class="top-controls one-control">
    <div class="control-card"><label>後攻:</label><div class="seg"><button id="autoBtn">自動</button><button id="manualBtn" class="on">手動</button></div></div>
  </section>

  

  <section class="info-row">
    <div class="info-box"><b>ターン</b><strong id="turnCount">0ターン</strong></div>
    <div class="info-box"><b>空きマス</b><strong id="emptyCount">32</strong></div>
    <div class="info-box"><b>状態</b><strong id="modeText">手動</strong></div>
  </section>

  <section class="board-shell">
    <div class="cols"><span></span><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span></div>
    <div class="board-row">
      <div class="rows"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div>
      <div id="board" class="board"></div>
    </div>
  </section>

  <section class="bottom-actions">
    <button id="undoBtn">← 一つ前に戻る</button>
    <button id="recommendBtn">☆ 最善手を表示</button>
    <button id="resetBtn">↻ 最初から</button>
  </section>

  <section class="status" id="statusLine">黒（先攻）の番です。 黄色いマスが置ける場所です。</section>

  <section id="result" class="result"></section>
</div>

        for(const[dr,dc]of DIR){const rr=r+dr,cc=c+dc;if(inside(rr,cc)&&b[rr][cc]===E){frontier=true;break}}
        if(frontier){if(b[r][c]===p)frontierP++;else if(b[r][c]===-p)frontierO++}
      }
    }
    const my=legalMoves(b,p).length,op=legalMoves(b,-p).length;
    const e=empties(b);
    const mobility=(my-op)*(e>20?16:e>12?13:9);
    const frontier=(frontierO-frontierP)*(e>16?5:3);

    // 潜在可動性：次に手を作りやすい空きマスを評価。
    let potentialP=0,potentialO=0;
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(b[r][c]===E){
      let adjOpp=false,adjMe=false;
      for(const[dr,dc]of DIR){
        const rr=r+dr,cc=c+dc;
        if(!inside(rr,cc))continue;
        if(b[rr][cc]===-p)adjOpp=true;
        else if(b[rr][cc]===p)adjMe=true;
      }
      if(adjOpp)potentialP++;
      if(adjMe)potentialO++;
    }
    const potential=(potentialP-potentialO)*(e>16?3:1);

    // 角を取った後までX/C打ちを強く罰し続けないよう動的補正。
    let cornerAdj=0;
    for(const [r,c] of [[0,0],[0,5],[5,0],[5,5]]){
      const owner=b[r][c];
      if(owner===E)continue;
      const sr=r===0?1:-1, sc=c===0?1:-1;
      for(const [rr,cc] of [[r+sr,c],[r,c+sc],[r+sr,c+sc]]){
        const x=b[rr][cc];
        if(x===p)cornerAdj+=(owner===p?24:-8);
        else if(x===-p)cornerAdj-=(owner===-p?24:-8);
      }
    }

    const discs=count(b,p)-count(b,-p);
    // 序中盤は石数を重くしすぎない。終盤だけ石差を効かせる。
    const disc=discs*(e>20?0.15:e>12?0.45:1.5);
    const parity=e<=14?(e%2?3:-3):0;
    return positional+mobility+frontier+potential+cornerAdj+parity+disc;
  }

  function moveOrderScore(b,m,p){
    let s=m.f.length*2;
    const corner=(m.r===0||m.r===5)&&(m.c===0||m.c===5);
    if(corner)s+=100000;
    if((m.r===1||m.r===4)&&(m.c===1||m.c===4))s-=12000;
    if((m.r===0||m.r===5)&&(m.c===1||m.c===4))s-=2500;
    if((m.c===0||m.c===5)&&(m.r===1||m.r===4))s-=2500;
    const nb=applyMove(b,m,p);
    s-=legalMoves(nb,-p).length*180; // 相手の可動性を減らす手を先に読む
    // 相手に角を渡す手は大幅減点
    for(const om of legalMoves(nb,-p))if((om.r===0||om.r===5)&&(om.c===0||om.c===5))s-=30000;
    return s;
  }
  function orderMoves(b,moves,p,ttMove){
    return moves.slice().sort((a,bm)=>{
      const aa=(ttMove&&a.r===ttMove.r&&a.c===ttMove.c?1000000:0)+moveOrderScore(b,a,p);
      const bb=(ttMove&&bm.r===ttMove.r&&bm.c===ttMove.c?1000000:0)+moveOrderScore(b,bm,p);
      return bb-aa;
    });
  }

  function checkTime(){
    if((++searchNodes&2047)===0 && searchDeadline && performance.now()>searchDeadline)throw TIMEOUT;
  }

  function negamax(b,p,depth,alpha,beta,passed=false){
    checkTime();
    const alpha0=alpha,beta0=beta,k=boardKey(b,p);
    const hit=TT.get(k);
    if(hit&&hit.depth>=depth){
      if(hit.flag===0)return hit.value;
      if(hit.flag===1)alpha=Math.max(alpha,hit.value);
      else if(hit.flag===2)beta=Math.min(beta,hit.value);
      if(alpha>=beta)return hit.value;
    }
    const moves=legalMoves(b,p);
    if(!moves.length){
      if(passed){
        const diff=count(b,p)-count(b,-p);
        return diff*10000;
      }
      return -negamax(b,-p,depth,-beta,-alpha,true);
    }
    if(depth<=0)return featureEval(b,p);

    let best=-Infinity,bestMoveLocal=null,first=true;
    const ordered=orderMoves(b,moves,p,hit&&hit.move);
    for(const m of ordered){
      const nb=applyMove(b,m,p);
      let v;
      // PVS: 2手目以降はまず null-window、必要時だけ再探索。
      if(first){
        v=-negamax(nb,-p,depth-1,-beta,-alpha,false);
        first=false;
      }else{
        v=-negamax(nb,-p,depth-1,-alpha-1,-alpha,false);
        if(v>alpha&&v<beta)v=-negamax(nb,-p,depth-1,-beta,-alpha,false);
      }
      if(v>best){best=v;bestMoveLocal={r:m.r,c:m.c}}
      if(v>alpha)alpha=v;
      if(alpha>=beta)break;
    }
    const flag=best<=alpha0?2:best>=beta0?1:0; // 0 exact, 1 lower, 2 upper
    TT.set(k,{depth,value:best,flag,move:bestMoveLocal});
    return best;
  }

  function searchOneMove(b,m,p,depth){
    return -negamax(applyMove(b,m,p),-p,depth-1,-Infinity,Infinity,false);
  }

  function chooseBySearch(b,p,timeMs,strong=false){
    const moves=legalMoves(b,p); if(!moves.length)return null;
    const e=empties(b);
    const cacheKey=boardKey(b,p)+'|'+(strong?'S':'N');
    const cached=MOVE_CACHE.get(cacheKey);
    if(cached){
      const cm=moves.find(m=>m.r===cached.r&&m.c===cached.c);if(cm)return cm;
    }
    searchDeadline=performance.now()+timeMs; searchNodes=0;
    TT.clear();
    let best=orderMoves(b,moves,p,null)[0],completedDepth=0;
    // 終盤は可能なら完全読み。時間切れなら最後に完了した深さの手を返す。
    const target=(e<=16)?e+2:(strong?Math.min(12,e+2):Math.min(9,e+2));
    const start=strong?6:5;
    try{
      for(let d=Math.min(start,target);d<=target;d++){
        let localBest=best,localV=-Infinity;
        const rootOrder=orderMoves(b,moves,p,{r:best.r,c:best.c});
        for(const m of rootOrder){
          const v=searchOneMove(b,m,p,d);
          if(v>localV){localV=v;localBest=m}
        }
        best=localBest;completedDepth=d;
      }
    }catch(err){if(err!==TIMEOUT)throw err}
    searchDeadline=0;
    if(completedDepth>0)MOVE_CACHE.set(cacheKey,{r:best.r,c:best.c,depth:completedDepth});
    return best;
  }

  // 元サイト寄りの序盤ブック。
  // 盤の対称性を正規化して、ユーザー確認済みの D6 -> E3 -> D2 を含む。
  function symRC(r,c,t){
    switch(t){
      case 0:return [r,c];
      case 1:return [c,N-1-r];
      case 2:return [N-1-r,N-1-c];
      case 3:return [N-1-c,r];
      case 4:return [r,N-1-c];
      case 5:return [N-1-r,c];
      case 6:return [c,r];
      default:return [N-1-c,N-1-r];
    }
  }
  function transformedBoard(b,t){
    const n=Array.from({length:N},()=>Array(N).fill(E));
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){const [rr,cc]=symRC(r,c,t);n[rr][cc]=b[r][c]}
    return n;
  }
  function boardSig(b,p){return b.flat().join(',')+'|'+p}
  const openingBook=new Map();
  function addBookLine(coords){
    let b=Array.from({length:N},()=>Array(N).fill(E));
    b[2][2]=W;b[2][3]=B;b[3][2]=B;b[3][3]=W;
    let p=B;
    for(const [r,c] of coords){
      const f=flipsFor(b,r,c,p); if(!f.length) return;
      openingBook.set(boardSig(b,p),[r,c]);
      b=applyMove(b,{r,c,f},p); p=-p;
      if(!legalMoves(b,p).length&&legalMoves(b,-p).length)p=-p;
    }
  }
  // 写真の最善進行32手（初手D5向き）
  // D5→E3→D2→C5→B3→B4→C6→D6→E6→C2→C1→A3→E4→E5→A4→A5→B5→E1→F3→D1→F1→F5→E2→F2→B1→B2→F4→F6→A2→A1→B6→A6
  addBookLine([[4,3],[2,4],[1,3],[4,2],[2,1],[3,1],[5,2],[5,3],[5,4],[1,2],[0,2],[2,0],[3,4],[4,4],[3,0],[4,0],[4,1],[0,4],[2,5],[0,3],[0,5],[4,5],[1,4],[1,5],[0,1],[1,1],[3,5],[5,5],[1,0],[0,0],[5,1],[5,0]]);

  function bookMove(){
    // まず現在の盤面そのものを最優先で照合。
    const exact=openingBook.get(boardSig(board,turn));
    if(exact){
      const f=flipsFor(board,exact[0],exact[1],turn);
      if(f.length)return {r:exact[0],c:exact[1],f};
    }

    // その後に8対称も照合。
    for(let t=1;t<8;t++){
      const tb=transformedBoard(board,t), hit=openingBook.get(boardSig(tb,turn));
      if(hit){
        for(let r=0;r<N;r++)for(let c=0;c<N;c++){
          const [rr,cc]=symRC(r,c,t);
          if(rr===hit[0]&&cc===hit[1]){
            const f=flipsFor(board,r,c,turn);
            if(f.length)return {r,c,f};
          }
        }
      }
    }
    return null;
  }

  function bestMove(strong=false){
    const moves=legalMoves(board,turn);
    if(!moves.length)return null;
    const bm=bookMove();
    if(bm)return bm;
    if(plyCount===0&&turn===B){
      const d5=moves.find(m=>m.r===4&&m.c===3);
      if(d5)return d5;
    }
    // 表示用は短め、自動白AIは時間を多く使う。強さ優先。
    return chooseBySearch(board,turn,strong?4200:650,strong);
  }

  function boardStrengthForBlack(){
    return 50;
  }

  function onPerfectLine(){
    if(openingBook.has(boardSig(board,turn)))return true;
    for(let t=1;t<8;t++){
      if(openingBook.has(boardSig(transformedBoard(board,t),turn)))return true;
    }
    return false;
  }

  // White / second player: local 6x6-reversi-oracle.
  // All Oracle files are served from this same GitHub Pages site.
  const ORACLE_WORKER_URL='./oracle.worker.js';

  function failOracle(message){
    oracleReady=false;
    oracleDisabled=true;
    busy=false;
    console.error(message);
    const status=$('statusLine');
    if(status)status.textContent='Oracleを読み込めませんでした。手動モードはそのまま使えます。';
    render(false);
  }

  async function startOracle(){
    if(oracleDisabled)return false;
    if(oracleReady&&oracleWorker)return true;
    if(oracleStarting)return oracleStarting;
    oracleStarting=(async()=>{
      try{
        oracleWorker=new Worker(ORACLE_WORKER_URL,{type:'module'});
        oracleWorker.onmessage=e=>{
          const data=e.data;
          if(!Array.isArray(data)||data.length<2)return;
          const key=JSON.stringify(data[0]);
          const i=oraclePending.findIndex(x=>x.key===key);
          if(i>=0){
            const q=oraclePending.splice(i,1)[0];
            clearTimeout(q.timer);
            q.resolve(data[1]);
          }
        };
        oracleWorker.onerror=e=>{
          failOracle(e?.message||'Oracle worker error');
        };
        // Official worker initializes its WASM on startup.
        await new Promise(r=>setTimeout(r,400));
        oracleReady=true;
        return true;
      }catch(err){
        failOracle(err);
        oracleWorker=null;
        return false;
      }finally{
        oracleStarting=null;
      }
    })();
    return oracleStarting;
  }

  async function oracleRequest(seq){
    const ok=await startOracle();
    if(!ok||!oracleWorker)throw new Error('Oracle unavailable');
    const moves=seq.slice(),key=JSON.stringify(moves);
    return new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>{
        const i=oraclePending.findIndex(x=>x.key===key);
        if(i>=0)oraclePending.splice(i,1);
        reject(new Error('Oracle response timeout'));
      },30000);
      oraclePending.push({key,resolve,timer});
      oracleWorker.postMessage(moves);
    });
  }
  async function verifyOracleLineForBlack(){
    if(!oracleLineValid)return false;
    // Every completed white move must equal Oracle's prescribed white move.
    // Check only the latest white move: once invalid, it stays invalid until reset/undo.
    if(oracleMoves.length>=2 && oracleMoves.length%2===0){
      const whiteActual=oracleMoves[oracleMoves.length-1];
      const prefix=oracleMoves.slice(0,-1);
      try{
        const expected=await oracleRequest(prefix);
        if(Number(expected)!==Number(whiteActual)){
          oracleLineValid=false;
          return false;
        }
      }catch(err){
        oracleLineValid=false;
        return false;
      }
    }
    return true;
  }

  async function oracleBlackBest(){
    if(turn!==B||gameOver||busy)return null;
    const key=JSON.stringify(oracleMoves);
    if(oracleBlackKey===key&&oracleBlackMove)return oracleBlackMove;
    const learned=BLACK_LOSS_BOOK[key];
    if(Number.isInteger(learned)){
      const lr=Math.floor(learned/6),lc=learned%6,lf=flipsFor(board,lr,lc,B);
      if(lf.length){
        const lm={r:lr,c:lc,f:lf};
        oracleBlackKey=key;oracleBlackMove=lm;oracleBlackValue=null;
        return lm;
      }
    }
    if(!(await verifyOracleLineForBlack())){
      const local=chooseBySearch(board,B,1200,false);
      if(local){
        oracleBlackKey=key;oracleBlackMove=local;oracleBlackValue=null;
        return local;
      }
      return null;
    }
    const raw=await oracleRequest(oracleMoves);
    if(!(raw&&typeof raw==='object'))return null;
    const a=Array.from(raw);
    let best=null,bestValue=-Infinity;
    for(let i=0;i+1<a.length;i+=2){
      const idx=a[i],value=a[i+1];
      if(idx<0)break;
      const r=Math.floor(idx/6),c=idx%6,f=flipsFor(board,r,c,B);
      if(f.length&&value>bestValue){bestValue=value;best={r,c,f}}
    }
    if(best){oracleBlackKey=key;oracleBlackMove=best;oracleBlackValue=bestValue}
    return best;
  }
  async function refreshOracleBlackRecommendation(){
    if(turn!==B||gameOver||busy||!showRecommend)return;
    const key=JSON.stringify(oracleMoves);
    try{
      const m=await oracleBlackBest();
      if(turn===B&&!gameOver&&!busy&&showRecommend&&JSON.stringify(oracleMoves)===key&&m){
        recommendedKey=m.r+','+m.c;
        render(false);
      }
    }catch(err){console.warn('Black Oracle analysis unavailable',err)}
  }

  async function oracleWhiteMove(){
    return oracleRequest(oracleMoves);
  }

  function oracleIndexToMove(idx,p=W){
    if(!Number.isInteger(idx)||idx<0||idx>=36)return null;
    const r=Math.floor(idx/6),c=idx%6;
    const f=flipsFor(board,r,c,p);
    return f.length?{r,c,f}:null;
  }

  function save(){history.push({board:board.map(r=>r.slice()),turn,lastMove:lastMove&&{...lastMove},plyCount,gameOver,oracleMoves:oracleMoves.slice()})}
  function init(){
    board=Array.from({length:N},()=>Array(N).fill(E));
    board[2][2]=W;board[2][3]=B;board[3][2]=B;board[3][3]=W;
    turn=B;history=[];lastMove=null;plyCount=0;busy=false;gameOver=false;recommendedKey=null;oracleMoves=[];oracleBlackKey=null;oracleBlackMove=null;oracleLineValid=true;oracleExpectedWhite=null;oracleBlackValue=null;oracleDisabled=false;
    $('result').classList.remove('show');render();
    // Manual mode is default; never block first paint on Worker/WASM startup.
  }
  function doMove(r,c){
    if(busy||gameOver||(turn===W&&autoWhite))return;
    const f=flipsFor(board,r,c,turn);if(!f.length)return;
    save();oracleBlackKey=null;oracleBlackMove=null;oracleMoves.push(r*6+c);board=applyMove(board,{r,c,f},turn);lastMove={r,c,p:turn};plyCount++;turn=-turn;afterMove();
  }
  function afterMove(){
    let moves=legalMoves(board,turn);
    if(!moves.length){
      const other=legalMoves(board,-turn);
      if(!other.length){finish();return}
      oracleMoves.push(-1);turn=-turn;
    }
    render();
    if(!gameOver&&turn===W&&autoWhite)setTimeout(aiMove,120);
  }
  function aiMove(){
    if(gameOver||turn!==W||!autoWhite)return;
    const moves=legalMoves(board,W);
    if(!moves.length){afterMove();return}
    busy=true;
    render();
    setTimeout(async()=>{
      try{
        const idx=await oracleWhiteMove();
        const best=oracleIndexToMove(idx,W);
        if(!best)throw new Error('Oracle returned an illegal move: '+idx);
        save();
        oracleMoves.push(best.r*6+best.c);
        board=applyMove(board,best,W);
        lastMove={r:best.r,c:best.c,p:W};
        plyCount++;
        turn=B;
        busy=false;
        afterMove();
      }catch(err){
        failOracle(err);
      }
    },80);
  }
  function finish(){
    gameOver=true;busy=false;render();
    const b=count(board,B),w=count(board,W);
    $('result').textContent=(b>w?'黒の勝ち！':w>b?'白の勝ち！':'引き分け')+`　黒 ${b} - 白 ${w}`;
    $('result').classList.add('show');
  }
  function undo(){
    if(!history.length||busy)return;
    const s=history.pop();board=s.board.map(r=>r.slice());turn=s.turn;lastMove=s.lastMove;plyCount=s.plyCount;gameOver=s.gameOver;oracleMoves=(s.oracleMoves||[]).slice();oracleBlackKey=null;oracleBlackMove=null;
    $('result').classList.toggle('show',gameOver);render();
  }
  function render(triggerOracle=true){
    const moves=gameOver||busy?[]:legalMoves(board,turn);
    const map=new Map(moves.map(m=>[m.r+','+m.c,m]));

    if(showRecommend&&!gameOver&&!busy){
      const bm=bestMove();
      recommendedKey=bm?bm.r+','+bm.c:null;
    }else{
      recommendedKey=null;
    }

    $('board').innerHTML='';

    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const cell=document.createElement('button');
      cell.className='cell';

      if((r===0||r===5)&&(c===0||c===5))cell.classList.add('corner');
      if(lastMove&&lastMove.r===r&&lastMove.c===c)cell.classList.add('last');

      const k=r+','+c;
      const m=map.get(k);

      if(m)cell.classList.add('legal');
      if(showRecommend&&recommendedKey===k)cell.classList.add('recommended');

      if(board[r][c]===B)cell.innerHTML='<span class="stone b"></span>';
      else if(board[r][c]===W)cell.innerHTML='<span class="stone w"></span>';

      cell.onclick=()=>doMove(r,c);
      $('board').appendChild(cell);
    }

    const b=count(board,B),w=count(board,W);
    $('blackCount').textContent=b;
    $('whiteCount').textContent=w;
    $('emptyCount').textContent=empties(board);
    $('turnCount').textContent=Math.floor(plyCount/2)+'ターン';
    $('modeText').textContent=autoWhite?'自動':'手動';

    $('statusLine').textContent=
      gameOver?'ゲーム終了。結果を確認してください。':
      busy?'白（後攻・必勝Oracle）が考えています…':
      (turn===B?'黒（先攻）':'白（後攻）')+'の番です。 ★が最善手です。'+(onPerfectLine()?' 解析済み進行。':'');
    if(triggerOracle&&turn===B&&!gameOver&&!busy&&showRecommend){
      setTimeout(refreshOracleBlackRecommendation,0);
    }
  }

  $('manualBtn').onclick=()=>{
    autoWhite=false;
    busy=false;
    $('manualBtn').classList.add('on');
    $('autoBtn').classList.remove('on');
    render();
  };

  $('autoBtn').onclick=()=>{
    autoWhite=true;
    $('autoBtn').classList.add('on');
    $('manualBtn').classList.remove('on');
    render();
    if(turn===W&&!gameOver)setTimeout(aiMove,100);
  };

  $('recommendBtn').onclick=()=>{
    showRecommend=true;
    render();
  };

  $('undoBtn').onclick=undo;
  $('resetBtn').onclick=init;

  // iPhone Safariのダブルタップ拡大を抑止
  let lastTouchEnd=0;
  document.addEventListener('touchend',e=>{
    const now=Date.now();
    if(now-lastTouchEnd<=300)e.preventDefault();
    lastTouchEnd=now;
  },{passive:false});

  try{
    init();
    const f=document.getElementById('bootFallback');
    if(f)f.classList.remove('show');
  }catch(err){
    console.error('init failed',err);
    const f=document.getElementById('bootFallback');
    if(f){f.classList.add('show');f.textContent='画面の初期化に失敗しました。GitHub上のファイルを確認してください。';}
  }
})();
</script>
